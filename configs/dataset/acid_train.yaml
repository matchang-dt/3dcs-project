# ACID Dataset Configuration
# Training split (same structure as RE10K; sharded .torch format)

_target_: datasets.dataset.DatasetCfg

name: acid
data_root: /workspace/re10kvol/acid
stage: train

# View sampling configuration
num_input_views: 2
num_target_views: 4

# Image configuration
target_image_size: 256

# Training schedule
max_train_steps: 300000  # Baseline expansion over 300k steps
normalize_scene: false
make_baseline_1: true  # scale context (and target) so context baseline = 1; near/far scaled accordingly