# @package _global_
# Training configuration (merged at root when composed with config.yaml)
dataset:
  _target_: datasets.dataset.DatasetCfg
  name: re10k
  data_root: /workspace/re10kvol/re10k
  stage: train
  num_input_views: 2
  num_target_views: 4
  target_image_size: 256
  max_train_steps: 300000
  normalize_scene: false

# Optimizer
optimizer:
  name: adam
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]

# Learning rate scheduler
scheduler:
  name: cosine
  T_max: 300000
  eta_min: 1.0e-6
  warmup_steps: 2000

# Training parameters
batch_size: 2
num_workers: 4
max_steps: 300000
val_check_interval: 5000
log_every_n_steps: 1000
gradient_clip_val: 1.0
num_gpus: 1

# Loss configuration
loss:
  rgb_loss_weight: 1.0
  lpips_loss_weight: 0.1

# Checkpointing
checkpoint:
  save_top_k: 3
  monitor: val/loss
  mode: min
  save_last: true
  dirpath: checkpoints/
  filename: mvsplat-{epoch:02d}-{step:06d}

# Mixed precision
precision: 32-true  # or '32' or 'bf16-mixed'

# Save validation images to disk (optional, set to a path to enable)
save_images_dir: /workspace/3dcs-project/outputs/val_images  # e.g. "outputs/val_images"
save_images_every_n_val: 1  # Save every N validation runs (1 = every time)
