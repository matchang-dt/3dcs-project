# @package _global_
# Training configuration (merged at root when composed with config.yaml)

# Optimizer
optimizer:
  name: adam
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]

# Learning rate scheduler
scheduler:
  name: cosine
  T_max: 300000
  eta_min: 1.0e-6
  warmup_steps: 2000

# Training parameters
batch_size: 6
num_workers: 4
max_steps: 300000
val_check_interval: 5000
limit_val_batches: 20  # max validation batches per run (IterableDataset has no fixed length)
log_every_n_steps: 10
log_images_every_n_steps: 100
val_log_first_n_images: 5
gradient_clip_val: 1.0
num_gpus: 1  # adjust this in command line

# Validation dataset: overrides merged with main dataset config (e.g. stage: test for RE10K test set)
val_dataset:
  stage: test

# Loss configuration
loss:
  rgb_loss_weight: 1.0
  lpips_loss_weight: 0.05

# Checkpointing
checkpoint:
  save_top_k: 3
  monitor: val/loss
  mode: min
  save_last: true
  dirpath: checkpoints/
  filename: mvsplat-{epoch:02d}-{step:06d}
  save_every_n_train_steps: 5000

resume_from_checkpoint: null # from path

# Mixed precision
precision: 32-true  # or '32' or 'bf16-mixed'

# Save validation images to disk (optional, set to a path to enable)
save_images_dir: /workspace/3dcs-project/outputs/val_images  # e.g. "outputs/val_images"
save_images_every_n_val: 1  # Save every N validation runs (1 = every time)