# @package _global_
# Training configuration (merged at root when composed with config.yaml)
# Dataset is selected via the config group, e.g. dataset=re10k_train or dataset=acid_train
# (see configs/dataset/*.yaml). Do not duplicate dataset fields here.

# validation: first 100 scenes from re10k/test (only one image log per scene though)
val_dataset:
  stage: test
  limit_scenes: 100

# Optimizer
optimizer:
  name: adam
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]

# Learning rate scheduler
scheduler:
  name: cosine
  T_max: 600000
  eta_min: 1.0e-6
  warmup_steps: 2000

# Training parameters
batch_size: 6
num_workers: 4
max_steps: 600000

val_check_interval: 5000  # run validation every N training steps
# check_val_every_n_epoch: 1000  # only relevant for finite datasets with defined epochs
# log_every_n_steps: 1000
log_every_n_steps: 50
log_images_every_n_steps: 1000
gradient_clip_val: 1.0
num_gpus: 1  # adjust this in command line
depth_map_vmin: 0.02
depth_map_vmax: 0.98

# Loss configuration
loss:
  rgb_loss_weight: 1.0
  lpips_loss_weight: 0.05

# Checkpointing
checkpoint:
  save_top_k: 3
  monitor: train/loss
  mode: min
  save_last: true
  dirpath: checkpoints/
  filename: mvsplat-{epoch:02d}-{step:06d}
  save_every_n_train_steps: 10000

resume_from_checkpoint: null

# Mixed precision
# precision: 16-mixed  # or '32' or 'bf16-mixed'
precision: 32-true  # or '32' or 'bf16-mixed'

# Save validation images to disk (optional, set to a path to enable)
save_images_dir: /workspace/3dcs-project/outputs/val_images  # e.g. "outputs/val_images"
save_images_every_n_val: 1  # Save every N validation runs (1 = every time)