# @package _global_
# Model parameters (merged at root when composed with config.yaml)

# Extractor
image_size: 256
hidden_dim: 128
swin_divisions: 2

# Data types
cnn_dtype: float32
transformer_dtype: float32
pipeline_dtype: float32

# Cost volume
max_depth: 100.0
feature_dim: 128
near: 1.0  
far: 100.0

# Splat head (shared between Gaussian and Convex heads)
gaussian_head_channels: 132 # 128 (features) + 4 (RGB + depth)
opacity_start: 0.5
opacity_end: 2.0
opacity_warmup: 10000

# Shared splat adapter params
sh_degree: 4
scale_min: 0.5
scale_max: 15.0
gaussians_per_pixel: 1
num_surfaces: 1

# Gaussian-specific adapter params
gaussian_scale_pct: 0.1

# Convex splat params
use_convex: false # false: render gaussians, true: render convexes
nb_points: 6       # vertices per convex (6 default from paper)
splat_scale_pct: 0.1